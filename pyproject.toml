[project]
name = "dimplex-controller"
version = "0.13.1"
description = "Unofficial async Python client for Dimplex (GDHV IoT) heating appliances — not affiliated with Glen Dimplex"
authors = [{ name = "Kieran Roper" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = ["dimplex", "heating", "control", "iot", "asyncio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
# Lower bounds are the versions this release was developed and tested against;
# the upper bounds keep the previous caret semantics (a caret range is
# `>=X,<next-major`), so consumers gain no surprise from the migration.
dependencies = [
    "aiohttp>=3.14.3,<4",
    "pydantic>=2.13.5,<3",
]

[project.urls]
Homepage = "https://github.com/KRoperUK/dimplex-controller-py"
Repository = "https://github.com/KRoperUK/dimplex-controller-py"

[project.scripts]
dimplex = "dimplex_controller.cli:main"

# PEP 735 dependency groups: not installed into a consumer's environment, only
# into a development one.
[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "aresponses>=3.0.0,<4",
    "ruff>=0.16.7,<0.17",
    "pre-commit>=4.6.2,<5",
    "twine>=7.0.0,<8",
    "python-dotenv>=1.2.3,<2",
    "mypy>=2.3.1,<3",
]

[tool.ruff]
line-length = 120
target-version = "py310"
# Python inside Markdown is not formatted here. The code blocks in README.md and
# docs/ carry deliberate column alignment (see the temperature-constant table in
# docs/api-reference.md) and ruff's formatter normalises comment spacing, so
# formatting them would trade readable docs for tool uniformity. This also keeps a
# bare `ruff format .` in step with the pre-commit hooks, which are python/pyi only.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
# E501 (line length) is handled by the formatter; long strings/comments are fine.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["dimplex_controller"]
ignore_missing_imports = true
# `strict` rather than the four flags this used to carry (disallow_untyped_defs,
# warn_return_any, warn_unused_configs, warn_redundant_casts). The library is the
# layer the Home Assistant integration trusts for models, capabilities and error
# types, and that consumer runs strict mypy over its own code — so a library
# checked more loosely could hand it types that do not hold
# (dimplex-controller-hass#202).
#
# Raising it surfaced seven stale `# type: ignore` comments, all of which mypy
# reported as unused, plus one missing generic argument. No real type errors.
strict = true

[tool.pytest.ini_options]
# All async tests use asyncio; "auto" means new tests don't each need the
# @pytest.mark.asyncio decorator (existing markers remain valid).
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["dimplex_controller"]

[tool.coverage.report]
show_missing = true
# Guardrail so coverage can't silently regress. Raise as coverage improves.
fail_under = 80

[build-system]
requires = ["uv_build>=0.11.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The package is at the repository root, not under src/, which is what uv_build
# assumes by default. The module name is inferred from the project name
# (dimplex-controller -> dimplex_controller), so it needs no override.
module-root = ""
