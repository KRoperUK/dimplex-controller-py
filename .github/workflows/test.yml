name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether the change touches library code or CI config. Docs-only PRs
  # skip lint/test matrix but still get a green `ci` gate so the required
  # status check on main stays satisfiable.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'dimplex_controller/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.pre-commit-config.yaml'
              - '.github/workflows/test.yml'
            docs:
              - '**/*.md'
              - 'scripts/check-md-alerts.sh'
              - '.github/workflows/test.yml'

  # Markdown guard, kept separate from `lint` so a documentation-only PR is still
  # checked without pulling in ruff/mypy or the Python test matrix — the same
  # split the integration repo uses.
  #
  # A GitHub alert marker that is not alone on its line, or not inside a
  # blockquote, renders as literal characters with no complaint from GitHub. This
  # repository's README uses one for the unofficial-project notice, so it is worth
  # a gate rather than a proof-read.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check GitHub alert syntax in Markdown
        run: bash scripts/check-md-alerts.sh

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        # `--frozen`, deliberately not `--locked`. release-please bumps the version
        # in pyproject.toml without touching uv.lock, and uv records the project's
        # own version inside the lock — so `--locked` fails on every release PR and
        # leaves main's lock "stale" until someone refreshes it. `--frozen` installs
        # exactly what the lock pins and does not read pyproject in place of it.
        # A dependency added without re-locking still fails loudly, as a missing
        # import in the tests rather than a silent drift.
        run: uv sync --frozen

      - name: Lint with ruff
        # ruff comes from uv.lock, via the lock's dependency group — the single
        # source of its version, shared with the pre-commit hooks.
        run: uv run ruff check dimplex_controller/ tests/

      - name: Check formatting
        run: uv run ruff format --check dimplex_controller/ tests/

      - name: Type check with mypy
        # uv resolves mypy *and* the runtime dependencies from the lock. That
        # matters: with pydantic unresolvable and `ignore_missing_imports = true`,
        # `BaseModel` is `Any` and strict's `disallow_subclassing_any` reports
        # "Class cannot subclass BaseModel (has type Any)" for every model in the
        # package — 20 errors, none of them real.
        #
        # Output is converted into GitHub annotations (inline on the PR diff) while
        # pipefail preserves the exit status, so a type error surfaces on the
        # offending line instead of only in the raw log.
        run: |
          set -o pipefail
          uv run mypy | sed -E \
            -e 's/^([^:]+):([0-9]+): error: (.*)$/::error file=\1,line=\2::\3/' \
            -e 's/^([^:]+):([0-9]+): note: (.*)$/::notice file=\1,line=\2::\3/'

  pre-commit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pre-commit on all files
        # Through `uv run`, so the ruff hooks — which run the environment's ruff
        # (`language: system`) rather than a pinned pre-commit mirror — resolve the
        # version from uv.lock, exactly as a contributor's `uv run pre-commit` does.
        run: uv run pre-commit run --all-files --show-diff-on-failure --color=always

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python (>=3.10) in pyproject.toml and the Python
        # classifiers the package publishes. 3.14 is the runtime the consuming Home
        # Assistant integration targets.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests with coverage
        run: uv run pytest --cov=dimplex_controller --cov-report=term-missing

  # Stable required status check for the `main` branch ruleset.
  # - Python/code changes: fails unless lint, pre-commit, and the full test matrix succeed
  # - Docs changes: fails unless the markdown guard succeeds
  # - Other changes: succeeds without running the heavy jobs
  ci:
    name: ci
    needs: [changes, docs, lint, pre-commit, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce required jobs for code changes
        run: |
          set -euo pipefail
          code="${{ needs.changes.outputs.code }}"
          docs="${{ needs.changes.outputs.docs }}"
          echo "code changes: ${code}"
          echo "docs changes: ${docs}"
          echo "docs: ${{ needs.docs.result }}"
          echo "lint: ${{ needs.lint.result }}"
          echo "pre-commit: ${{ needs.pre-commit.result }}"
          echo "test: ${{ needs.test.result }}"

          failed=0

          if [ "${docs}" = "true" ] && [ "${{ needs.docs.result }}" != "success" ]; then
            echo "::error::docs did not succeed (${{ needs.docs.result }})"
            failed=1
          fi

          if [ "${code}" != "true" ]; then
            if [ "${failed}" -eq 0 ]; then
              echo "No library/test/CI paths changed — CI gate OK."
            fi
            exit "${failed}"
          fi

          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::lint did not succeed (${{ needs.lint.result }})"
            failed=1
          fi
          if [ "${{ needs.pre-commit.result }}" != "success" ]; then
            echo "::error::pre-commit did not succeed (${{ needs.pre-commit.result }})"
            failed=1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::test matrix did not succeed (${{ needs.test.result }})"
            failed=1
          fi
          exit "${failed}"
