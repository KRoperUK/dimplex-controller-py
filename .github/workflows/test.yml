name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether the change touches library code or CI config. Docs-only PRs
  # skip lint/test matrix but still get a green `ci` gate so the required
  # status check on main stays satisfiable.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'dimplex_controller/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'poetry.lock'
              - '.pre-commit-config.yaml'
              - '.github/workflows/test.yml'
            docs:
              - '**/*.md'
              - 'scripts/check-md-alerts.sh'
              - '.github/workflows/test.yml'

  # Markdown guard, kept separate from `lint` so a documentation-only PR is still
  # checked without pulling in ruff/mypy or the Python test matrix — the same
  # split the integration repo uses.
  #
  # A GitHub alert marker that is not alone on its line, or not inside a
  # blockquote, renders as literal characters with no complaint from GitHub. This
  # repository's README uses one for the unofficial-project notice, so it is worth
  # a gate rather than a proof-read.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check GitHub alert syntax in Markdown
        run: bash scripts/check-md-alerts.sh

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          # The lock too: this job reads the mypy version out of it.
          cache-dependency-path: |
            pyproject.toml
            poetry.lock

      - name: Install ruff
        # Pinned to the same version as .pre-commit-config.yaml so the pre-commit
        # and CI invocations of ruff cannot drift.
        run: pip install "ruff==$(grep -A1 'ruff-pre-commit' .pre-commit-config.yaml | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | sed 's/^v//')"

      - name: Lint with ruff
        run: ruff check dimplex_controller/ tests/

      - name: Check formatting
        run: ruff format --check dimplex_controller/ tests/

      - name: Install mypy
        # The version poetry resolves, read from the lock rather than left to
        # float. `poetry run mypy` locally and this job must agree: with `strict`
        # set, a version difference is not cosmetic, it changes which checks run.
        run: pip install "mypy==$(awk '/^name = "mypy"$/{getline; print; exit}' poetry.lock | sed -E 's/^version = "(.*)"$/\1/')"

      - name: Install runtime dependencies
        # mypy must be able to resolve pydantic and aiohttp, or `strict` cannot
        # check the library at all. With `ignore_missing_imports = true`, an
        # unresolvable pydantic makes `BaseModel` itself `Any`, and strict's
        # `disallow_subclassing_any` then reports "Class cannot subclass
        # BaseModel (has type Any)" for every model in the package — 20 errors,
        # none of them real. Installing the package brings its own dependencies,
        # so this cannot drift when a runtime dependency is added.
        run: pip install .

      - name: Type check with mypy
        # Convert mypy output into GitHub annotations (inline on the PR diff) while
        # preserving its exit status via pipefail, so type errors are surfaced on the
        # offending line instead of only in the raw log.
        run: |
          set -o pipefail
          mypy | sed -E \
            -e 's/^([^:]+):([0-9]+): error: (.*)$/::error file=\1,line=\2::\3/' \
            -e 's/^([^:]+):([0-9]+): note: (.*)$/::notice file=\1,line=\2::\3/'

  pre-commit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on all files
        # Pre-commit runs the local hook suite (trailing-whitespace, end-of-file-fixer,
        # ruff, ruff-format). It catches drift between the ruff-pre-commit pin and
        # the ruff pin in pyproject.toml.
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python (>=3.10) in pyproject.toml. 3.13 is added so the
        # library stays forward-compatible with the Python version the consuming
        # Home Assistant integration now targets.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests with coverage
        run: poetry run pytest --cov=dimplex_controller --cov-report=term-missing

  # Stable required status check for the `main` branch ruleset.
  # - Python/code changes: fails unless lint, pre-commit, and the full test matrix succeed
  # - Docs changes: fails unless the markdown guard succeeds
  # - Other changes: succeeds without running the heavy jobs
  ci:
    name: ci
    needs: [changes, docs, lint, pre-commit, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce required jobs for code changes
        run: |
          set -euo pipefail
          code="${{ needs.changes.outputs.code }}"
          docs="${{ needs.changes.outputs.docs }}"
          echo "code changes: ${code}"
          echo "docs changes: ${docs}"
          echo "docs: ${{ needs.docs.result }}"
          echo "lint: ${{ needs.lint.result }}"
          echo "pre-commit: ${{ needs.pre-commit.result }}"
          echo "test: ${{ needs.test.result }}"

          failed=0

          if [ "${docs}" = "true" ] && [ "${{ needs.docs.result }}" != "success" ]; then
            echo "::error::docs did not succeed (${{ needs.docs.result }})"
            failed=1
          fi

          if [ "${code}" != "true" ]; then
            if [ "${failed}" -eq 0 ]; then
              echo "No library/test/CI paths changed — CI gate OK."
            fi
            exit "${failed}"
          fi

          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::lint did not succeed (${{ needs.lint.result }})"
            failed=1
          fi
          if [ "${{ needs.pre-commit.result }}" != "success" ]; then
            echo "::error::pre-commit did not succeed (${{ needs.pre-commit.result }})"
            failed=1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::test matrix did not succeed (${{ needs.test.result }})"
            failed=1
          fi
          exit "${failed}"
