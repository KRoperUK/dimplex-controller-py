name: release-please

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
        steps:
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              id: release
              with:
                  release-type: python
                  # Prefer a PAT / GitHub App token when one is configured, and fall
                  # back to the workflow token so this still works unconfigured.
                  #
                  # Why it is worth configuring: commits authored by
                  # `github-actions[bot]` put their workflow runs into
                  # `action_required` with zero jobs created. `ci` is a required
                  # status check, so the release PR sits BLOCKED with an empty
                  # `statusCheckRollup` until someone approves the runs by hand —
                  # which is exactly what happened to #100, and to the integration's
                  # release PR four times over. A token that is not the Actions bot
                  # makes the runs start normally
                  # (KRoperUK/dimplex-controller-hass#200).
                  #
                  # Create a fine-grained PAT with `Contents: read/write` and
                  # `Pull requests: read/write` on this repository and add it as the
                  # `RELEASE_PLEASE_TOKEN` repository secret. Nothing else changes.
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

    publish:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created }}
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/p/dimplex-controller
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install uv
              uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
              with:
                  python-version: "3.10"

            - name: Build package
              # uv_build, configured in [tool.uv.build-backend]. The artefacts were
              # diffed against the poetry-built 0.13.1 before switching: same module
              # set, same entry point, same license file. The only metadata change is
              # PEP 639 — License-Expression replaces the License field, and the
              # now-deprecated license classifier is gone.
              run: uv build

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
              with:
                  verbose: true
